# Fixed before the L1 run. Do not edit this file in response to the plotted ranking.
paper: "Tang, Wu, Fan, Jin. Benign Overfitting in Out-of-Distribution Generalization of Linear Models. ICLR 2025."
target: "Figure 1(c) and Appendix A.2"
pdf: "https://proceedings.iclr.cc/paper_files/paper/2025/file/dcf51b2eef1af32e594177b326f8cff9-Paper-Conference.pdf"
log_n_axis:
  base: e
  tick_min: 5
  tick_max: 8
  n_points: 7
k_major: 10
noise_variance: 0.1
n_test: 1000
n_runs: 10
seed_base: 20261027
seed_stride: 10007
seed_scope: "L1 only. Not an L2 protocol seed list."
ridge_objective: "paper_unnormalized_||y-Xb||^2 + lambda ||b||^2"
pcr: "top k right singular vectors of the same n training rows"
acceptance_metric: "population excess risk ||beta_hat - beta_star||^2 with Sigma_T = I"
acceptance_bands:
  pcr_slope_interval: [-1.35, -0.65]
  ridge_n075_slope_interval: [-0.80, -0.20]
  pcr_minus_ridge_n075_max: -0.20
